name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (GitHub OIDC); no NPM_TOKEN secret is read (26540)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      # Pre-publish gate: suite must be green before anything is built or
      # published. If this fails, no tarballs reach npm.
      - run: bun run test
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing needs npm >= 11.5.1 for the OIDC token exchange; Node 23 ships
      # an older npm. pnpm publish hands the upload to this npm (26540).
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Build and publish packages
        run: |
          publish() {
            local dir=$1
            local name=$(node -e "console.log(require('./$dir/package.json').name)")
            local version=$(node -e "console.log(require('./$dir/package.json').version)")
            local published=$(npm view "$name@$version" version 2>/dev/null || echo "")
            if [ "$published" = "$version" ]; then
              echo "⏭ $name@$version already published"
            else
              echo "🔨 Building $name@$version..."
              (cd $dir && bunx tsdown)
              echo "📦 Publishing $name@$version..."
              # pnpm publish (not npm publish) — pnpm applies publishConfig.exports overrides
              (cd $dir && pnpm publish --access public --no-git-checks)
            fi
          }

          publish packages/vt100
          publish packages/vt220
          publish packages/vterm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
